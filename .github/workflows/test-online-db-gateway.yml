name: Test Android DB online gateway Blynk routes

on:
  push:
    branches:
      - feature/androiddb-online-remote-admin-20261125
    paths:
      - "edge/cloudflare/**"
      - "tests/edge-cloudflare-online-gateway.test.mjs"
      - ".github/workflows/test-online-db-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-iot-route-allowlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check archived Worker source
        run: |
          set -euo pipefail
          node --check edge/cloudflare/ani-games-db-android-stage-gateway.mjs
          node --check edge/cloudflare/ani-games-db-android-stage-ws-relay.mjs
      - name: Test exact Blynk allowlist at both Worker layers
        run: node --test tests/edge-cloudflare-online-gateway.test.mjs
      - name: Verify loopback-only bootstrap remains blocked and no wildcard IoT route exists
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path("edge/cloudflare/ani-games-db-android-stage-gateway.mjs").read_text()
          r=Path("edge/cloudflare/ani-games-db-android-stage-ws-relay.mjs").read_text()
          for route in ('"/iot/status"','"/iot/power"'):
              assert route in g and route in r
          assert 'path.startsWith("/iot/")' not in g and 'path.startsWith("/iot/")' not in r
          assert '"/setup"' in g and '"/api/admin/bootstrap"' in g
          assert '"/setup"' in r and '"/api/admin/bootstrap"' in r
          assert '/_ani_gateway/health' in g and '/_relay/health' in r
          PY
