name: Test Remote Play and Sunshine pairing on PostgreSQL
# Updated: include permanent activation-code revocation regression coverage.

on:
  push:
    branches:
      - feature/remote-androiddb-live-coin-20261125
    paths:
      - "backend/android-db/migrations/**"
      - "backend/android-db/server/**"
      - "backend/android-db/tests/011_remote_play_pairing_smoke.sql"
      - "backend/android-db/tests/012_remote_play_admin_controls_smoke.sql"
      - "backend/android-db/tests/013_remote_play_server_watchdog_smoke.sql"
      - "backend/android-db/tests/014_remote_play_stream_billing_clock_smoke.sql"
      - "backend/android-db/tests/015_remote_coin_wallet_smoke.sql"
      - ".github/workflows/test-androiddb-remote-play.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-remote-play:
    name: Fresh PostgreSQL Remote Play / pairing regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ani_games_remote_play_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ani_games_remote_play_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout isolated DB Android Remote Play branch
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply existing DB Android schema and Remote Play migrations to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for file in \
            backend/android-db/migrations/000_prerequisites.sql \
            backend/android-db/migrations/002_core_business_schema.sql \
            backend/android-db/migrations/003_pc_device_api_functions.sql \
            backend/android-db/migrations/004_billing_reseller_api.sql \
            backend/android-db/migrations/005_runtime_privileges.sql \
            backend/android-db/migrations/006_admin_local_auth_and_rpc.sql \
            backend/android-db/migrations/007_billing_control_commands.sql \
            backend/android-db/migrations/008_local_business_triggers.sql \
            backend/android-db/migrations/009_admin_business_routines.sql \
            backend/android-db/migrations/010_billing_reseller_refresh_and_devices.sql \
            backend/android-db/migrations/011_billing_control_android_rpcs.sql \
            backend/android-db/migrations/012_billing_stop_pause_policy.sql \
            backend/android-db/migrations/013_remote_play.sql \
            backend/android-db/migrations/014_remote_play_pairing.sql \
            backend/android-db/migrations/015_remote_play_admin_controls.sql \
            backend/android-db/migrations/016_remote_play_cloudflare_mesh.sql \
            backend/android-db/migrations/017_remote_play_dashboard_cooldown.sql \
            backend/android-db/migrations/018_remote_play_server_watchdog.sql \
            backend/android-db/migrations/019_remote_play_session_connected.sql \
            backend/android-db/migrations/020_remote_coin_wallet.sql; do
              echo "Applying $file"
              psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_remote_play_test -v ON_ERROR_STOP=1 -f "$file"
          done
          # 001_db1_catalog_snapshot.sql is intentionally excluded; it is not a replayable migration.

      - name: Run existing DB Android regression suite
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for file in \
            backend/android-db/tests/001_pc_device_api_smoke.sql \
            backend/android-db/tests/002_billing_reseller_api_smoke.sql \
            backend/android-db/tests/003_runtime_privileges_smoke.sql \
            backend/android-db/tests/004_admin_local_auth_smoke.sql \
            backend/android-db/tests/005_billing_control_commands_smoke.sql \
            backend/android-db/tests/006_local_business_triggers_smoke.sql \
            backend/android-db/tests/007_admin_device_policy_smoke.sql \
            backend/android-db/tests/008_admin_enrollment_reports_theme_smoke.sql \
            backend/android-db/tests/009_admin_billing_user_crud_smoke.sql \
            backend/android-db/tests/010_billing_refresh_smoke.sql; do
              echo "Testing $file"
              psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_remote_play_test -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Test Remote Play login and Sunshine pairing contracts/privileges
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_remote_play_test -v ON_ERROR_STOP=1 -f backend/android-db/tests/011_remote_play_pairing_smoke.sql

      - name: Test Owner Remote Play dashboard, permissions, enrollment, activation and Mesh IP allowlist
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_remote_play_test -v ON_ERROR_STOP=1 -f backend/android-db/tests/012_remote_play_admin_controls_smoke.sql

      - name: Test internal server-side Remote Play stale-session watchdog
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_remote_play_test -v ON_ERROR_STOP=1 -f backend/android-db/tests/013_remote_play_server_watchdog_smoke.sql

      - name: Test billing clock starts only after an authenticated stream-connected event
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_remote_play_test -v ON_ERROR_STOP=1 -f backend/android-db/tests/014_remote_play_stream_billing_clock_smoke.sql

        run: |
          set -euo pipefail

      - name: Test coin wallet lots, top-ups, expiry, rates and StarDesk mapping without touching rental time
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_remote_play_test -v ON_ERROR_STOP=1 -f backend/android-db/tests/015_remote_coin_wallet_smoke.sql

      - name: Test coin wallet lots, top-ups, expiry, rates and StarDesk mapping without touching rental time
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_remote_play_test -v ON_ERROR_STOP=1 -f backend/android-db/tests/015_remote_coin_wallet_smoke.sql

      - name: Install Node dependency and syntax-check DB Android API gateway
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check API source
        working-directory: backend/android-db/server
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
