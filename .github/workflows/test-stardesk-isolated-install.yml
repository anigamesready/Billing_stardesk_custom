name: Validate StarDesk isolated database installation

on:
  push:
    branches:
      - feature/admin-androiddb-v0-full-db-20261126
    paths:
      - "backend/android-db/termux/install-stardesk-custom-v0.sh"
      - "backend/android-db/relay-agent/install-stardesk-agent.sh"
      - "backend/android-db/migrations/**"
      - "backend/android-db/server/**"
      - "tests/stardesk-isolated-install.test.mjs"
      - "tests/stardesk-api-smoke.mjs"
      - ".github/workflows/test-stardesk-isolated-install.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install static audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck postgresql-client
      - name: Check shell syntax and lint isolated installers
        run: |
          set -euo pipefail
          bash -n backend/android-db/termux/install-stardesk-custom-v0.sh
          bash -n backend/android-db/relay-agent/install-stardesk-agent.sh
          bash -n backend/android-db/termux/audit-admin-v0-live-db.sh
          shellcheck -s bash backend/android-db/termux/install-stardesk-custom-v0.sh
          shellcheck -s bash backend/android-db/relay-agent/install-stardesk-agent.sh
      - name: Test StarDesk isolation guards and source contracts
        run: |
          node --test tests/stardesk-isolated-install.test.mjs
          node --test tests/android-gateway-dns-pin.test.mjs
      - name: Apply isolated migration bundle to a fresh test database
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE ani_api_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE ani_games_ready_stage;"
          psql -v ON_ERROR_STOP=1 -d ani_games_ready_stage -c "CREATE TABLE public.legacy_keep(marker text PRIMARY KEY); INSERT INTO public.legacy_keep VALUES ('untouched');"
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE stardesk_v0_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE stardesk_custom_v0 OWNER stardesk_v0_owner;"
          sed 's/ani_api_runtime/stardesk_v0_runtime/g' backend/android-db/migrations/000_prerequisites.sql |
            psql -v ON_ERROR_STOP=1 -d stardesk_custom_v0
          psql -v ON_ERROR_STOP=1 -d stardesk_custom_v0 <<'SQL'
          ALTER DATABASE stardesk_custom_v0 OWNER TO stardesk_v0_owner;
          ALTER SCHEMA public OWNER TO stardesk_v0_owner;
          ALTER SCHEMA api OWNER TO stardesk_v0_owner;
          ALTER SCHEMA auth OWNER TO stardesk_v0_owner;
          ALTER SCHEMA private OWNER TO stardesk_v0_owner;
          ALTER SCHEMA reporting_private OWNER TO stardesk_v0_owner;
          GRANT USAGE ON SCHEMA extensions TO stardesk_v0_owner;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA extensions TO stardesk_v0_owner;
          ALTER TABLE auth.users OWNER TO stardesk_v0_owner;
          SQL
          for migration in \
            002_core_business_schema.sql \
            003_pc_device_api_functions.sql \
            004_billing_reseller_api.sql; do
            { printf 'SET ROLE stardesk_v0_owner;\n'; sed 's/ani_api_runtime/stardesk_v0_runtime/g' "backend/android-db/migrations/$migration"; } |
              psql -v ON_ERROR_STOP=1 -d stardesk_custom_v0
          done
          sed 's/ani_api_runtime/stardesk_v0_runtime/g' backend/android-db/migrations/005_runtime_privileges.sql |
            psql -v ON_ERROR_STOP=1 -d stardesk_custom_v0
          psql -v ON_ERROR_STOP=1 -d stardesk_custom_v0 <<'SQL'
          ALTER DEFAULT PRIVILEGES FOR ROLE stardesk_v0_owner IN SCHEMA api REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC;
          ALTER DEFAULT PRIVILEGES FOR ROLE stardesk_v0_owner IN SCHEMA api GRANT EXECUTE ON FUNCTIONS TO stardesk_v0_runtime;
          SQL
          for migration in \
            006_admin_local_auth_and_rpc.sql \
            007_billing_control_commands.sql \
            008_local_business_triggers.sql \
            009_admin_business_routines.sql \
            010_billing_reseller_refresh_and_devices.sql \
            011_billing_control_android_rpcs.sql \
            012_billing_stop_pause_policy.sql \
            013_remote_play.sql \
            014_remote_play_pairing.sql \
            015_remote_play_admin_controls.sql \
            016_remote_play_cloudflare_mesh.sql \
            017_remote_play_dashboard_cooldown.sql \
            018_remote_play_server_watchdog.sql \
            019_remote_play_session_connected.sql \
            020_remote_coin_wallet.sql \
            021_android_wol_relay.sql \
            022_coin_unit_scale_100.sql \
            023_admin_coin_management_read_api.sql \
            025_admin_androiddb_v0_coin_domain.sql; do
            { printf 'SET ROLE stardesk_v0_owner;\n'; sed 's/ani_api_runtime/stardesk_v0_runtime/g' "backend/android-db/migrations/$migration"; } |
              psql -v ON_ERROR_STOP=1 -d stardesk_custom_v0
          done
          psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          CREATE ROLE stardesk_v0_login LOGIN PASSWORD 'test-only-password' INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE;
          GRANT stardesk_v0_runtime TO stardesk_v0_login;
          GRANT CONNECT ON DATABASE stardesk_custom_v0 TO stardesk_v0_login;
          SQL
          ISOLATION_OK="$(psql -At -d stardesk_custom_v0 -c "SELECT (current_database()='stardesk_custom_v0' AND to_regnamespace('androiddb_v0') IS NOT NULL AND to_regprocedure('api.androiddb_v0_admin_dashboard(text,integer)') IS NOT NULL AND to_regprocedure('api.androiddb_v0_remote_login(text,text,text)') IS NOT NULL AND NOT pg_has_role('stardesk_v0_login','ani_api_runtime','MEMBER') AND pg_has_role('stardesk_v0_login','stardesk_v0_runtime','MEMBER') AND NOT has_table_privilege('stardesk_v0_login','public.devices','SELECT') AND (SELECT pg_get_userbyid(proowner)='stardesk_v0_owner' FROM pg_proc WHERE oid='api.admin_bootstrap_owner(text,text,text,text)'::regprocedure) AND (SELECT NOT rolsuper AND NOT rolcanlogin FROM pg_roles WHERE rolname='stardesk_v0_owner'))::int")"
          test "$ISOLATION_OK" = "1"
          LOGIN_OK="$(PGPASSWORD=test-only-password psql -h 127.0.0.1 -U stardesk_v0_login -d stardesk_custom_v0 -Atc "SELECT current_user='stardesk_v0_login' AND has_function_privilege(current_user,'api.admin_bootstrap_owner(text,text,text,text)','EXECUTE') AND NOT has_table_privilege(current_user,'public.devices','SELECT')")"
          test "$LOGIN_OK" = "t"
          psql -v ON_ERROR_STOP=1 -d stardesk_custom_v0 <<'SQL'
          SET ROLE stardesk_v0_owner;
          INSERT INTO private.admin_bootstrap_control(singleton,token_hash)
          VALUES(true, encode(extensions.digest('ci-smoke-bootstrap-token-which-is-long-enough-64','sha256'),'hex'));
          SQL
          npm install --prefix backend/android-db/server --omit=dev --no-audit --no-fund
          DATABASE_URL='postgresql://stardesk_v0_login:test-only-password@127.0.0.1:5432/stardesk_custom_v0' \
            node tests/stardesk-api-smoke.mjs
          LEGACY_MARKER="$(psql -At -d ani_games_ready_stage -c "SELECT marker FROM public.legacy_keep")"
          test "$LEGACY_MARKER" = "untouched"
