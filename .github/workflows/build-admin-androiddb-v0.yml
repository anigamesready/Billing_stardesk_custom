name: Build Ani Games Admin Android DB v0 Full DB Candidate

on:
  push:
    branches:
      - feature/admin-androiddb-v0-isolated-20261125
      - feature/admin-androiddb-v0-full-db-20261126
    paths:
      - "admin-androiddb-v0/**"
      - "backend/android-db/server/server.mjs"
      - "backend/android-db/migrations/006_admin_local_auth_and_rpc.sql"
      - "backend/android-db/migrations/009_admin_business_routines.sql"
      - "backend/android-db/migrations/011_billing_control_android_rpcs.sql"
      - ".github/workflows/test-androiddb-remote-play.yml"
      - ".github/workflows/build-admin-androiddb-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin-androiddb-v0:
    name: Build Admin Android DB v0 0.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout isolated Admin Android DB v0 source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate isolated UI and RPC contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("admin-androiddb-v0/app/src/main/assets/index.html").read_text(encoding="utf-8")
          required = [
              "Ani Games Admin Android DB v0",
              "ANDROID DB",
              "admin_context",
              "admin_rental_accounts_global",
              "admin_create_rental_global",
              "admin_update_rental_global",
              "admin_disable_rental_global",
              "admin_delete_rental_global",
              "admin_devices",
              "admin_device_state",
              "admin_rename_device",
              "admin_disconnect_device",
              "admin_command",
              "admin_command_status",
              "admin_active_sessions",
              "admin_selected_sessions",
              "admin_start_trial",
              "create_device_recovery_enrollment",
              "create_enrollment",
              "report_summary_compact",
              "report_monthly_rental_summary",
              "report_detailed_usage_page",
              "report_rental_period_breakdown",
              "admin_activity",
              "admin_recent_alerts",
              "admin_get_free_test_policy",
              "admin_set_free_test_policy",
              "admin_get_billing_stop_pause_policy",
              "admin_set_billing_stop_pause_policy",
              "save_theme",
              "admin_change_password",
              "dashboard_billing_users",
              "dashboard_billing_user",
              "create_reseller",
              "admin_remote_play_dashboard",
              "admin_remote_play_sessions",
              "admin_remote_play_set_rental_permission",
              "admin_remote_play_set_host_permission",
              "admin_remote_play_issue_client_credential",
              "admin_remote_play_issue_host_enrollment",
              "wol_relay_status",
              "wol_relay_create_enrollment",
              "wol_relay_enqueue",
              "wol_relay_command_status",
              "wol_relay_probe_request",
              "wol_relay_probe_status",
              "__iot_status",
              "__iot_power",
              "androiddb_v0_admin_dashboard",
              "androiddb_v0_admin_create_rental",
              "androiddb_v0_admin_issue_activation",
              "androiddb_v0_admin_wallet",
              "androiddb_v0_admin_approve_topup",
              "androiddb_v0_admin_reject_topup",
              "androiddb_v0_admin_set_device_rate",
              "androiddb_v0_admin_link_stardesk_device",
              "androiddb_v0_admin_set_host_permission",
              "androiddb_v0_admin_issue_host_enrollment",
              "AniCoin",
              "androiddb_v0",
              "legacy",
              "reportOutput",
              "orgSelect",
          ]
          for token in required:
              assert token.lower() in html.lower(), "missing Admin Android DB full integration contract: " + token
          for forbidden in [
              "supabase.co",
              "functions/v1/stardesk-client-api",
              "id=\"apiBase\"",
              "id=\"serverUrl\"",
              "DB1",
              "DB2",
              "schedule_shutdown",
              "CREATE TABLE",
              "DROP TABLE",
              "TRUNCATE TABLE",
              "localStorage.setItem",
          ]:
              assert forbidden.lower() not in html.lower(), "forbidden backend or manual database path in v0 UI: " + forbidden
          assert "AniAdminV0.apiRequest" in html, "native Android DB HTTPS bridge missing"
          assert "https://ani-games-db-android-stage-gateway.anigamesready.workers.dev" not in html, "gateway URL must stay hidden inside native bridge"
          assert "OWNER_ONLY" in html and 'ctx.role||"").toLowerCase()==="owner"' in html, "Owner-only UI guard missing"
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert len(scripts) == 1, "expected one inline UI script"
          # Every inline button handler must resolve to a real JS function.
          onclick_bodies = re.findall(r'onclick="([^"]+)"', html, re.I)
          onclick_bodies += re.findall(r"onclick='([^']+)'", html, re.I)
          handler_names = set()
          for body in onclick_bodies:
              match = re.match(r"\s*([A-Za-z_$][A-Za-z0-9_$]*)\s*\(", body)
              if match:
                  handler_names.add(match.group(1))
          defined_functions = set(re.findall(r"function\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*\(", scripts[0]))
          missing_handlers = sorted(handler_names - defined_functions)
          assert not missing_handlers, "Admin button handler missing JS function: " + ", ".join(missing_handlers)
          Path("/tmp/admin-androiddb-v0.js").write_text(scripts[0], encoding="utf-8")

          server = Path("backend/android-db/server/server.mjs").read_text(encoding="utf-8")
          rpc_start = server.index("const RPC = {")
          rpc_lines = server[rpc_start:].splitlines()
          expected_rpc = [
              "admin_context",
              "admin_rental_accounts_global", "admin_create_rental_global",
              "admin_update_rental_global", "admin_disable_rental_global", "admin_delete_rental_global",
              "admin_devices", "admin_device_state", "admin_rename_device", "admin_disconnect_device",
              "admin_command", "admin_command_status", "admin_active_sessions", "admin_selected_sessions",
              "admin_start_trial", "create_device_recovery_enrollment", "create_enrollment",
              "report_summary_compact", "report_monthly_rental_summary", "report_detailed_usage_page",
              "report_rental_period_breakdown", "admin_activity", "admin_recent_alerts",
              "admin_get_free_test_policy", "admin_set_free_test_policy",
              "admin_get_billing_stop_pause_policy", "admin_set_billing_stop_pause_policy",
              "save_theme", "admin_change_password", "dashboard_billing_users", "dashboard_billing_user",
              "create_reseller", "admin_remote_play_dashboard", "admin_remote_play_sessions",
              "admin_remote_play_set_rental_permission", "admin_remote_play_set_host_permission",
              "admin_remote_play_issue_client_credential", "admin_remote_play_issue_host_enrollment",
              "wol_relay_status", "wol_relay_create_enrollment", "wol_relay_enqueue",
              "wol_relay_command_status", "wol_relay_probe_request", "wol_relay_probe_status",
              "androiddb_v0_admin_dashboard", "androiddb_v0_admin_create_rental",
              "androiddb_v0_admin_set_rental_status", "androiddb_v0_admin_issue_activation",
              "androiddb_v0_admin_wallet", "androiddb_v0_admin_approve_topup",
              "androiddb_v0_admin_reject_topup", "androiddb_v0_admin_set_device_rate",
              "androiddb_v0_admin_link_stardesk_device", "androiddb_v0_admin_set_host_permission",
              "androiddb_v0_admin_issue_host_enrollment",
          ]
          for route in expected_rpc:
              assert any(line.strip().startswith(route + ":") for line in rpc_lines), "UI RPC absent from Android DB backend allowlist: " + route
          # Check every literal RPC actually called by the UI, not just a hand-maintained list.
          ui_rpc_routes = set(re.findall(r"\bapi\(\s*'([^']+)'", html))
          ui_rpc_routes.update(re.findall(r'\bapi\(\s*"([^"]+)"', html))
          ui_rpc_routes.update(["admin_set_free_test_policy", "admin_set_billing_stop_pause_policy"])
          native_routes = {"__admin_login", "__admin_refresh", "__admin_logout", "__iot_status", "__iot_power", "__gateway_health"}
          assert len(ui_rpc_routes) >= 50, "Admin v0 UI RPC coverage unexpectedly shrank"
          for route in sorted(ui_rpc_routes - native_routes):
              assert any(line.strip().startswith(route + ":") for line in rpc_lines), "UI RPC call has no Android DB backend allowlist entry: " + route

          for native_route in ["__admin_login", "__admin_refresh", "__admin_logout", "__iot_status", "__iot_power"]:
              assert native_route in Path("admin-androiddb-v0/app/src/main/java/com/anigamesready/adminandroiddbv0/MainActivity.java").read_text(encoding="utf-8"), "native route missing: " + native_route

          java = Path("admin-androiddb-v0/app/src/main/java/com/anigamesready/adminandroiddbv0/MainActivity.java").read_text(encoding="utf-8")
          for token in ["AndroidKeyStore", "AES/GCM/NoPadding", "HttpsURLConnection", "ani_admin_androiddb_v0_keystore_v1", "__admin_login", "__admin_refresh", "__admin_logout", "__iot_status", "__iot_power", "/iot/status", "/iot/power", "setRequestMethod(method)", '"GET".equals(method)', "WebChromeClient", "onJsAlert", "onJsConfirm", "onJsPrompt", "JsPromptResult", "JsResult"]:
              assert token in java, "missing native token/API/HTTP method control: " + token

          gradle = Path("admin-androiddb-v0/app/build.gradle").read_text(encoding="utf-8")
          for token in ['applicationId "com.anigames.billingadmin.androiddbv0"', "versionCode 2", 'versionName "0.2.0-full-db"']:
              assert token in gradle, "Admin Android DB v0 build identity mismatch: " + token

          manifest = Path("admin-androiddb-v0/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          assert 'android:label="Ani Games Admin Android DB v0"' in manifest
          assert 'android:usesCleartextTraffic="false"' in manifest
          PY
          node --check /tmp/admin-androiddb-v0.js

      - name: Build isolated Admin APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p admin-androiddb-v0 clean assembleDebug
          APK="admin-androiddb-v0/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/Ani-Games-Admin-Android-DB-v0-Full-DB-Preview-0.2.0.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -n "$AAPT" && test -n "$APKSIGNER"
          "$AAPT" dump badging output/Ani-Games-Admin-Android-DB-v0-Full-DB-Preview-0.2.0.apk | tee output/apk-badging.txt
          grep -q "package: name='com.anigames.billingadmin.androiddbv0' versionCode='2' versionName='0.2.0-full-db'" output/apk-badging.txt
          grep -q "application-label:'Ani Games Admin Android DB v0'" output/apk-badging.txt
          "$APKSIGNER" verify --verbose output/Ani-Games-Admin-Android-DB-v0-Full-DB-Preview-0.2.0.apk
          "$APKSIGNER" verify --print-certs output/Ani-Games-Admin-Android-DB-v0-Full-DB-Preview-0.2.0.apk
          sha256sum output/Ani-Games-Admin-Android-DB-v0-Full-DB-Preview-0.2.0.apk | tee output/SHA256SUMS.txt
          unzip -t output/Ani-Games-Admin-Android-DB-v0-Full-DB-Preview-0.2.0.apk
          ls -lh output/Ani-Games-Admin-Android-DB-v0-Full-DB-Preview-0.2.0.apk

      - name: Upload isolated Admin Android DB v0 preview
        uses: actions/upload-artifact@v4
        with:
          name: Ani-Games-Admin-Android-DB-v0-Full-DB-Preview-0.2.0
          path: output/*
          if-no-files-found: error
          retention-days: 30
