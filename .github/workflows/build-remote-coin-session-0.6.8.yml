name: Build Ani Games Ready Remote Coin Session 0.6.8 SAFE-TEST

on:
  push:
    branches:
      - feature/stardesk-coin-remote-task1-3-20261128
    paths:
      - "android-client/**"
      - "backend/android-db/server/server.mjs"
      - "backend/android-db/migrations/031_stardesk_invite_coin_sessions.sql"
      - "backend/android-db/termux/upgrade-stardesk-coin-031.sh"
      - "tests/remote-coin-session-popup-contract.test.mjs"
      - "tests/stardesk-coin-031-postgres-smoke.sql"
      - ".github/workflows/build-remote-coin-session-0.6.8.yml"

permissions:
  contents: read

jobs:
  source-contracts:
    name: Validate Remote / API / DB contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check API and Termux script syntax
        run: |
          set -euo pipefail
          node --check backend/android-db/server/server.mjs
          bash -n backend/android-db/termux/upgrade-stardesk-coin-031.sh
      - name: Parse WebView JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("android-client/app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert len(scripts) == 1
          Path("/tmp/remote-coin-0.6.8.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/remote-coin-0.6.8.js
      - name: Run Remote popup and Agent Coin contracts
        run: |
          node --test \
            tests/remote-coin-session-popup-contract.test.mjs \
            tests/stardesk-agent-coin-contract.test.mjs

  postgres-smoke:
    name: Apply migration 031 and test Coin lifecycle on disposable PostgreSQL
    runs-on: ubuntu-latest
    needs: source-contracts
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Apply migration 031 and execute lifecycle smoke tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/stardesk-coin-031-postgres-smoke.sql

  android-remote:
    name: Build Remote Android APK 0.6.8
    runs-on: ubuntu-latest
    needs: [source-contracts, postgres-smoke]
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Remote SAFE-TEST APK
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p android-client clean assembleDebug
          mkdir -p out
          cp android-client/app/build/outputs/apk/debug/app-debug.apk out/Ani-Games-Ready-Remote-0.6.8-Coin-Session-SAFE-TEST.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          "$AAPT" dump badging out/Ani-Games-Ready-Remote-0.6.8-Coin-Session-SAFE-TEST.apk | tee out/remote-badging.txt
          grep -q "package: name='com.anigamesready.stardeskclient.coinx100preview' versionCode='14' versionName='0.6.8-coin-session'" out/remote-badging.txt
          "$APKSIGNER" verify --verbose out/Ani-Games-Ready-Remote-0.6.8-Coin-Session-SAFE-TEST.apk
          sha256sum out/Ani-Games-Ready-Remote-0.6.8-Coin-Session-SAFE-TEST.apk | tee out/SHA256-REMOTE-0.6.8.txt
          unzip -t out/Ani-Games-Ready-Remote-0.6.8-Coin-Session-SAFE-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ani-Games-Ready-Remote-0.6.8-Coin-Session-SAFE-TEST
          path: |
            out/Ani-Games-Ready-Remote-0.6.8-Coin-Session-SAFE-TEST.apk
            out/SHA256-REMOTE-0.6.8.txt
            out/remote-badging.txt
          if-no-files-found: error
          retention-days: 30
